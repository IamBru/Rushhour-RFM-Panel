name: Owner encrypted backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: owner-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.RFM_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          # Ubuntu 24.04's default repositories do not provide PostgreSQL 17.
          # Add the official PostgreSQL repository, scoped to its signing key.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y age postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          age --version
          python -m pip install -r scripts/backup-requirements.txt
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Back up and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.RFM_BACKUP_DB_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.RFM_BACKUP_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.RFM_BACKUP_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.RFM_BACKUP_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.RFM_BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ vars.RFM_BACKUP_AGE_RECIPIENT }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/rfm-encrypted
        run: python scripts/owner_backup.py
      - name: Keep encrypted recovery point
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rfm-owner-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rfm-encrypted/*.age
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cleanup:
    needs: backup
    if: github.ref == 'refs/heads/main' && needs.backup.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove older backups after successful upload
        uses: actions/github-script@v8
        env:
          NEW_BACKUP_ARTIFACT_ID: ${{ needs.backup.outputs.artifact_id }}
        with:
          script: |
            const cleanup = require('./scripts/prune-backups.cjs');
            await cleanup({github, context, core, artifactId: process.env.NEW_BACKUP_ARTIFACT_ID});
