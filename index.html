<body><main id="app" class="shell"></main><div id="modal-root"></div><div id="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// To publish a shared app, put your Supabase URL and *publishable/anon* key here.
// Never use a Supabase service_role or secret API key in this page.
const CONFIG = { SUPABASE_URL: 'https://txkdglpakojrotnmsaos.supabase.co/', SUPABASE_ANON_KEY: 'sb_publishable_hx9d4Nd-tOFGusFEv4md7w_xQxNlb7e' };
const $ = s => document.querySelector(s);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now();
const initialItems = [
 ['IZH-81','Shotguns','12 Gauge'],['Ithaca 37','Shotguns','12 Gauge'],['Heavy Shotgun','Shotguns','12 Gauge'],['Bullpup Shotgun','Shotguns','12 Gauge'],['Double Barrel Shotgun','Shotguns','12 Gauge'],
 ['Beretta M9','Pistols','9mm'],['Fn Fnx-45','Pistols','.45 ACP'],['Desert Eagle','Pistols','.50 AE'],['Enterprise Wide Body 1911A','Pistols','.45 ACP'],['M1911','Pistols','.45 ACP'],['Colt 1911','Pistols','9mm'],['Colt Python','Pistols','.44 magnum'],['SNS Pistol','Pistols','0.38'],['SNS Pistol MK II','Pistols','0.38'],['Glock','Pistols','9mm']
];
const initialStock = [
 [0,0,9],[0,1,1],[0,2,2],[1,2,1],[1,3,7],[1,4,4],[3,1,1],[4,1,1],[5,1,7],[5,2,4],[5,3,1],[6,1,6],[6,2,7],[6,3,21],[7,1,2],[7,2,1],[8,0,4],[8,2,2],[9,1,1],[10,3,4],[11,1,1],[12,1,2],[12,2,1],[12,3,2],[13,3,1],[14,3,2]
];
function seedData(){
 const items = initialItems.map(([name,category,detail],i)=>({id:'item-'+i,name,category,detail}));
 const storages = ['Gun Rack 1','Gun Rack 2','Gun Rack 3','Gun Stash','Utilities'].map((name,i)=>({id:'storage-'+i,name,storage_group_id:'local-main'}));
 return {room:{id:'local',name:'RFM Inventory',join_code:''},storage_groups:[{id:'local-main',name:'Main storage group'}],items,storages,stock:initialStock.map(([a,b,q])=>({item_id:items[a].id,storage_id:storages[b].id,quantity:q})),logs:[],members:[]};
}
let state = {mode:'local',data:null,client:null,roomId:null,name:localStorage.getItem('rfm_name')||'',search:'',filter:'All',tab:'storages',logSearch:'',busy:false,lastSync:null,modal:null,drag:null};
function localSave(){localStorage.setItem('rfm_local',JSON.stringify(state.data));}
function toast(msg,error=false){const el=$('#toast-root');el.innerHTML=`<div class="toast ${error?'error':''}">${esc(msg)}</div>`;clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>el.innerHTML='',3200)}
function icon(cat){return cat==='Shotguns'?'◈':cat==='Pistols'?'◇':'▦'}
const PHOTO_BUCKET = 'rfm-item-images';
function imageUrl(item){
 if(item?.image_data && typeof item.image_data==='string' && /^data:image\/(webp|jpeg|png);base64,/.test(item.image_data)) return item.image_data;
 if(state.mode==='cloud' && item?.image_path && state.client) return state.client.storage.from(PHOTO_BUCKET).getPublicUrl(item.image_path).data.publicUrl;
 return '';
}
function itemThumb(item,small=false){
 const url=imageUrl(item),klass=small?'stock-photo':'avatar';
 return `<span class="${klass}${url?' photo':''}">${url?`<img src="${esc(url)}" alt="" loading="lazy">`:icon(item.category)}</span>`;
}
function previewImage(url){const e=$('#image-preview');if(e)e.innerHTML=url?`<img alt="Selected item image preview" src="${esc(url)}">`:'No image selected';}
async function compressPhoto(file,maxDimension=540){
 if(!file || !['image/jpeg','image/png','image/webp'].includes(file.type)) throw Error('Choose a JPG, PNG or WebP image');
 if(file.size>12*1024*1024)throw Error('Image is too large (12 MB maximum before compression)');
 const temp=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=temp;await img.decode();
  const scale=Math.min(1,maxDimension/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image processing unavailable');
  ctx.fillStyle='#21182f';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.77));
  if(!blob || blob.type!=='image/webp'){
   const jpg=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.75));
   if(!jpg)throw Error('Unable to compress image');
   return {blob:jpg,extension:'jpg'};
  }
  if(blob.size>950000)throw Error('Compressed picture is still too large; use a smaller image');
  return {blob,extension:'webp'};
 }finally{URL.revokeObjectURL(temp)}
}
function blobDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not load image'));r.readAsDataURL(blob)})}
async function saveImage(itemId,file){
 const item=state.data.items.find(x=>x.id===itemId);if(!item)throw Error('Item not found');
 if(!isAdmin())throw Error('Only admins can change item images');
 const compressed=file?await compressPhoto(file):null;
 if(state.mode==='local'){
  const prev=item.image_data;item.image_data=compressed?await blobDataUrl(compressed.blob):null;
  try{localSave()}catch(e){item.image_data=prev;throw Error('This browser is out of local space. Connect a shared group to keep more images.');}
  logEntry(compressed?'image_updated':'image_removed',item.name,'','',0,compressed?'Changed item photo':'Removed item photo');localSave();render();return;
 }
 let path=null;
 if(compressed){
  path=`${state.roomId}/${itemId}/${uid()}.${compressed.extension}`;
  const {error}=await state.client.storage.from(PHOTO_BUCKET).upload(path,compressed.blob,{contentType:compressed.blob.type,upsert:false});
  if(error)throw new Error('Upload failed: '+error.message);
 }
 try{await rpc('set_item_image',{p_room:state.roomId,p_item:itemId,p_path:path});}
 catch(e){if(path)await state.client.storage.from(PHOTO_BUCKET).remove([path]).catch(()=>{});throw e;}
 if(item.image_path && item.image_path!==path)await state.client.storage.from(PHOTO_BUCKET).remove([item.image_path]).catch(()=>{});
 await refreshCloud();
}

function total(itemId){return state.data.stock.filter(x=>x.item_id===itemId).reduce((s,x)=>s+x.quantity,0)}
function stockQty(itemId,storageId){return state.data.stock.find(x=>x.item_id===itemId&&x.storage_id===storageId)?.quantity||0}
function currentName(){return state.mode==='cloud'&&state.roomId ? (state.data?.viewer?.name||'Member') : (state.name.trim()||'You')}
function isAdmin(){return state.mode==='local'||state.data?.viewer?.role==='admin'}
function dateText(s){return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function logEntry(action, item_name='',from_name='',to_name='',quantity=0,detail=''){
 const logs=state.data.logs; logs.unshift({id:Date.now()+Math.random(),actor_name:currentName(),action,item_name,from_name,to_name,quantity,detail,created_at:new Date().toISOString()});
}
function demoChange(action,itemId,fromId,toId,qty){
 const d=state.data,item=d.items.find(x=>x.id===itemId);let from=fromId?d.storages.find(x=>x.id===fromId):null,to=toId?d.storages.find(x=>x.id===toId):null;
 if(!item)throw Error('Item not found'); if(!Number.isInteger(qty)||qty<1)throw Error('Enter a positive quantity');
 if(action!=='add'){const row=d.stock.find(x=>x.item_id===itemId&&x.storage_id===fromId);if(!row||row.quantity<qty)throw Error('Not enough items in that storage');row.quantity-=qty;d.stock=d.stock.filter(x=>x.quantity>0)}
 if(action!=='remove'){let row=d.stock.find(x=>x.item_id===itemId&&x.storage_id===toId);if(row)row.quantity+=qty;else d.stock.push({item_id:itemId,storage_id:toId,quantity:qty})}

 if(kind==='storage'&&hasPhoto){imageData=await blobDataUrl((await compressPhoto(photo,160)).blob);if(imageData.length>350000)throw Error('Choose a smaller storage picture');}
 if(remove)imageData=null;
 if(state.mode==='local'){
  const before=entity.name;entity.name=name;
  if(kind==='item'){entity.category=category;entity.detail=detail;}
  if(kind==='storage')entity.image_data=imageData;
  logEntry(kind+'_updated',kind==='item'?name:'','','',0,`Updated ${kind.replace('_',' ')}: ${before} to ${name}`);localSave();
 }else if(kind==='item')await rpc('update_item',{p_room:state.roomId,p_item:id,p_name:name,p_category:category,p_detail:detail});
 else if(kind==='storage')await rpc('update_storage',{p_room:state.roomId,p_storage:id,p_name:name,p_replace_image:!!(hasPhoto||remove),p_image_data:imageData});
 else await rpc('rename_storage_group',{p_room:state.roomId,p_group:id,p_name:name});
 if(kind==='item'&&(hasPhoto||remove)){
  try{await saveImage(id,hasPhoto?photo:null)}catch(err){closeModal();if(state.mode==='cloud')await refreshCloud();else render();toast('Item details saved, but picture update failed: '+err.message,true);return;}
 }
 closeModal();if(state.mode==='cloud')await refreshCloud();else render();toast('Changes saved');
}
async function deleteEntity(kind,id){
 if(!isAdmin())throw Error('Only admins can delete items and storages');
 if(state.busy)return;
 const entity=entityRows(kind)?.find(x=>x.id===id);if(!entity)throw Error('Not found');
 const message=kind==='item'?'Are you sure? This will also delete this item from all storages.':kind==='storage'?`Delete storage "${entity.name}" and all its stock? Catalog items and activity history will be kept.`:`Delete storage group "${entity.name}", all its storages and their stock? Catalog items and activity history will be kept.`;
 if(!await confirmAction(message,'Delete '+kind.replace('_',' '),'Delete'))return;
 state.busy=true;
 try{
  if(state.mode==='cloud'){await rpc('delete_entity',{p_room:state.roomId,p_kind:kind,p_id:id});await refreshCloud();}
  else{
   const storageIds=kind==='storage'?[id]:kind==='storage_group'?state.data.storages.filter(x=>x.storage_group_id===id).map(x=>x.id):[];
   const removed=state.data.stock.filter(x=>kind==='item'?x.item_id===id:storageIds.includes(x.storage_id));
   const auditStock=removed.map(x=>({...x,before:x.quantity,item:state.data.items.find(i=>i.id===x.item_id)?.name,storage:state.data.storages.find(i=>i.id===x.storage_id)?.name}));
   state.data.stock=state.data.stock.filter(x=>!removed.includes(x));
   if(kind==='item')state.data.items=state.data.items.filter(x=>x.id!==id);
   if(storageIds.length)state.data.storages=state.data.storages.filter(x=>!storageIds.includes(x.id));
   if(kind==='storage_group')state.data.storage_groups=state.data.storage_groups.filter(x=>x.id!==id);
   logEntry(kind+'_deleted',kind==='item'?entity.name:'','','',0,JSON.stringify({name:entity.name,stock:auditStock}));localSave();render();
  }
  closeModal();toast('Deleted');
 }finally{state.busy=false}
}
function newStorageGroupModal(){
 if(state.mode==='cloud'&&!Array.isArray(state.data.storage_groups))throw Error('The storage groups database update must be applied first');
 setModal(`<h2>New storage group</h2><p>Organize storages under a group. Items go inside the storages.</p><form id="storage-group-form"><label class="field-label">Group name</label><input class="field" name="name" maxlength="80" placeholder="e.g. Headquarters" required>${modalActions('Create storage group')}</form>`);
}
function newStorageModal(groupId){
 const group=state.data.storage_groups?.find(g=>g.id===groupId);
 if(!group)throw Error('Choose a storage group first');
 setModal(`<h2>Add a storage</h2><p>Storage group: <b>${esc(group.name)}</b></p><form id="storage-form"><input type="hidden" name="storage_group_id" value="${esc(group.id)}"><label class="field-label">Storage name</label><input class="field" name="name" maxlength="80" placeholder="e.g. Locker A" required>${modalActions('Create storage')}</form>`);
}

function shareModal(){
 if(!isAdmin()){toast('Only admins can open settings',true);return;}
 const d=state.data;
 const rows=(d.members||[]).map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff17"><div><b>${esc(m.name)}</b> <span style="color:#ac9cc6;font-size:11px">${esc(m.role)}${m.active?'':' · revoked'}</span></div>${m.active&&m.user_id!==d.viewer.user_id?`<div class="flex"><button class="btn tiny" data-action="change-role" data-user="${esc(m.user_id)}" data-role="${m.role==='admin'?'member':'admin'}">${m.role==='admin'?'Demote':'Make admin'}</button><button class="btn tiny danger" data-action="revoke-member" data-user="${esc(m.user_id)}">Revoke</button></div>`:''}</div>`).join('');
 const invites=(d.invites||[]).map(inv=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0"><span style="font-size:12px">Unused ${esc(inv.role)} invite · expires ${esc(dateText(inv.expires_at))}</span><button class="btn tiny danger" data-action="cancel-invite" data-invite="${esc(inv.id)}">Cancel</button></div>`).join('');
 setModal(`<h2>Settings</h2><h3>Members & invitations</h3><p>Only admins can invite, remove or promote members. Each invitation is usable once and expires after 14 days.</p><form id="invite-form"><label class="field-label">Invite as</label><select class="field" name="role"><option value="member">Member</option><option value="admin">Admin</option></select>${modalActions('Create one-time invite')}</form><div style="margin-top:18px"><b style="font-size:13px">Members</b>${rows||'<div class="help">No members yet</div>'}</div>${invites?`<div style="margin-top:20px"><b style="font-size:13px">Unused invitations</b>${invites}</div>`:''}${state.mode==='cloud'?`<div class="setup-card" style="margin-top:20px"><b>Activity history</b><p>Permanently delete all activity logs for this RFM group. Inventory, catalog items and memberships stay unchanged. Export the activity log first if you want to keep a copy.</p><button class="btn danger full" data-action="clear-logs" type="button">Clear database logs</button></div>`:''}<div class="modal-actions"><button class="btn primary" data-action="close-modal">Done</button></div>`);
}
function showInvite(code,role,expiry){setModal(`<h2>One-time invitation ready</h2><p>Send this private code to your ${esc(role)}. It can be redeemed once before ${esc(dateText(expiry))}.</p><label class="field-label">Invitation code</label><input class="field" id="invite-code" readonly value="${esc(code)}"><div class="modal-actions"><button class="btn" data-action="copy-code">Copy code</button><button class="btn primary" data-action="share">Back to members</button></div><div class="tip">The code will not be displayed again after closing. Copy it now. Don't post it publicly.</div>`)}
// The RPC rechecks active-admin authorization before clearing database history.
async function clearLogs(){
 if(state.mode!=='cloud'||!state.roomId||!isAdmin())throw Error('Only active admins can clear database logs');
 if(state.busy)return;
 if(!await confirmAction('Permanently delete ALL activity logs for this RFM group? This cannot be undone. Export the activity log first if you need a copy.'))return;
 state.busy=true;
 const button=document.querySelector('[data-action="clear-logs"]');
 if(button)button.disabled=true;
 try{
  await rpc('clear_logs',{p_room:state.roomId});
  state.data.logs=[];state.logSearch='';
  closeModal();render();toast('Activity logs cleared');
  try{await refreshCloud()}catch{toast('Logs cleared, but the panel could not refresh. Refresh the page.',true)}
 }finally{state.busy=false;if(button)button.disabled=false;}
}
async function rpc(name, args){const {data,error}=await state.client.rpc('rfm_'+name,args);if(error)throw new Error(error.message||'Request failed');return data}
async function connectCloud(url,key){if(!window.supabase)throw Error('Cloud library unavailable. Check internet access.');if(!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(url.trim()))throw Error('Enter a valid Supabase project URL');if(key.includes('service_role')||key.startsWith('sb_secret_'))throw Error('Do not use a secret key. Use the publishable / anon key.');
 const client=window.supabase.createClient(url.trim().replace(/\/$/,''),key.trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 let {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){const res=await client.auth.signInAnonymously();if(res.error)throw new Error(res.error.message+' — enable Anonymous Sign-ins in Supabase Authentication.');}
 state.client=client;state.mode='cloud';state.roomId=localStorage.getItem('rfm_room_id')||null;
 // A cached room ID is only a hint. The server always checks current membership.
 if(state.roomId){
  try{await refreshCloud();}
  catch(e){
   // On a temporary network/API error, keep the cached room ID for a later retry.
   throw new Error('Could not verify your RFM membership right now: '+e.message);
  }
 }
 // Fresh browser or an old "leave view" action: recover the active membership
 // associated with the existing anonymous Supabase sign-in, without an invite.
 if(!state.roomId){
  const recovered=await rpc('restore_membership',{});
  if(recovered){
   state.roomId=recovered;
   localStorage.setItem('rfm_room_id',recovered);
   await refreshCloud();
  }
 }
 if(!state.roomId)render();
 window.clearInterval(window._syncInterval);
 window._syncInterval=setInterval(()=>{if(state.mode==='cloud'&&state.roomId&&!state.busy)refreshCloud(true).catch(()=>{})},5000);
}
async function refreshCloud(silent=false){if(!state.roomId)return;try{let data=await rpc('get_snapshot',{p_room:state.roomId});
 const previous=state.data?.logs||[];
 if(data.viewer?.role==='admin'&&previous.length>150&&data.logs.length>=150){
  const newCount=data.logs.filter(x=>Number(x.id)>Number(previous[0]?.id||0)).length;
  const target=previous.length+newCount,logs=[];
  while(logs.length<target){const limit=Math.min(1000,target-logs.length);const batch=await rpc('get_activity',{p_room:state.roomId,p_limit:limit,p_offset:logs.length});logs.push(...batch);if(batch.length<limit)break;}
  data.logs=logs;
 }
 state.data=data;state.name=data.viewer?.name||state.name;if(!isAdmin()&&state.tab==='activity')state.tab='storages';state.lastSync=Date.now();if(!silent||!document.activeElement||!['item-search','log-search'].includes(document.activeElement.id)){render()}}catch(e){if(/membership is inactive|do not have access/i.test(e.message)){state.roomId=null;localStorage.removeItem('rfm_room_id');state.tab='storages';closeModal();render();toast('Your RFM access has been revoked.',true);return;}throw e;}}
async function executeChange(action,item,from,to,qty){if(state.mode==='local')demoChange(action,item,from,to,qty);else await rpc('change_stock',{p_room:state.roomId,p_action:action,p_item:item,p_from:from||null,p_to:to||null,p_quantity:qty});if(state.mode==='cloud')await refreshCloud();else render()}
async function getExport(){
 if(!isAdmin())throw Error('Only admins can download backups');
 // Refresh the snapshot so a revoked or demoted admin cannot export cached data.
 const d=state.mode==='cloud'?await rpc('get_snapshot',{p_room:state.roomId}):state.data;
 if(state.mode==='cloud'&&d?.viewer?.role!=='admin')throw Error('Only active admins can download backups');
 return JSON.stringify({...d,exported_at:new Date().toISOString()},null,2);
}
function download(content,name,mime){const b=new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const csv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
async function exportLog(){if(!isAdmin())throw Error('Admin permission required');let logs=state.data.logs;
 if(state.mode==='cloud'){logs=[];let page=0;while(true){let batch=await rpc('get_activity',{p_room:state.roomId,p_limit:1000,p_offset:page*1000});logs.push(...batch);page++;if(batch.length<1000)break;if(page>50)throw Error('Too many history rows; ask to export an archive')} }
 const cols=['created_at','actor_name','action','item_name','quantity','from_name','to_name','detail'];download([cols.map(csv).join(','),...logs.map(x=>cols.map(k=>csv(x[k])).join(','))].join('\r\n'),'RFM-activity-'+new Date().toISOString().slice(0,10)+'.csv','text/csv');toast('Activity CSV downloaded')}
function bind(){
 document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 try{
 if(a==='confirm-action'){const resolve=confirmationResolve;confirmationResolve=null;closeModal();if(resolve)resolve(true);return}
 if(a==='remove-all'){await removeAll();return}
 if(a==='close-modal'){closeModal();return}
 if(a==='close-modal-overlay'){if(e.target===el)closeModal();return}
 if(a==='configure'){setupModal();return}
 if(a==='profile'){profileModal();return}
 if(a==='edit-entity'){editEntityModal(el.dataset.kind,el.dataset.id);return}
 if(a==='delete-entity'){await deleteEntity(el.dataset.kind,el.dataset.id);return}
 if(a==='new-item'){if(!isAdmin())throw Error('Only admins can create catalog items');newItemModal();return}
 if(a==='new-storage'){newStorageModal(el.dataset.storageGroup);return}
 if(a==='new-storage-group'){newStorageGroupModal();return}
 if(a==='share'){shareModal();return}
 if(a==='clear-logs'){await clearLogs();return}
 if(a==='revoke-member'){if(!isAdmin())throw Error('Admin only');const m=state.data.members.find(x=>x.user_id===el.dataset.user);if(!m)return;if(!await confirmAction('Revoke '+m.name+' access? This immediately prevents future inventory changes.'))return;await rpc('revoke_member',{p_room:state.roomId,p_user:m.user_id});await refreshCloud();shareModal();toast('Member access revoked');return}
 if(a==='change-role'){if(!isAdmin())throw Error('Admin only');const m=state.data.members.find(x=>x.user_id===el.dataset.user);if(!m)return;if(!await confirmAction('Change '+m.name+' to '+el.dataset.role+'?'))return;await rpc('set_member_role',{p_room:state.roomId,p_user:m.user_id,p_role:el.dataset.role});await refreshCloud();shareModal();toast('Role updated');return}
 if(a==='cancel-invite'){if(!isAdmin())throw Error('Admin only');if(!await confirmAction('Cancel this unused invitation?'))return;await rpc('cancel_invite',{p_room:state.roomId,p_invite:el.dataset.invite});await refreshCloud();shareModal();toast('Invitation canceled');return}
 if(a==='copy-code'){const input=$('#invite-code');if(!input)throw Error('No invitation code shown');await navigator.clipboard.writeText(input.value);toast('Personal invitation code copied');return}
 if(a==='filter'){state.filter=el.dataset.filter;render();return}
 if(a==='tab'){if(el.dataset.tab==='activity'&&!isAdmin())throw Error('Admin only');state.tab=el.dataset.tab;render();return}
 if(a==='add-one'){quantityModal({action:'add',itemId:el.dataset.item,toId:el.dataset.storageId});return}
 if(a==='remove-one'){quantityModal({action:'remove',itemId:el.dataset.item,fromId:el.dataset.storageId});return}
 if(a==='move-one'){quantityModal({action:'move',itemId:el.dataset.item,fromId:el.dataset.storageId});return}
 if(a==='export'){download(await getExport(),'RFM-inventory-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Backup downloaded');return}
 if(a==='export-log'){if(!isAdmin())throw Error('Admin only');await exportLog();return}
 if(a==='load-older'){if(!isAdmin())throw Error('Admin only');const batch=await rpc('get_activity',{p_room:state.roomId,p_limit:150,p_offset:state.data.logs.length});if(batch.length===0)toast('No older changes');else {state.data.logs.push(...batch);render()}return}
 if(a==='use-demo'){state.mode='local';state.roomId=null;state.data=JSON.parse(localStorage.getItem('rfm_local')||'null')||seedData();render();return}
 }catch(err){toast(err.message||'Something went wrong',true)}
 });
 document.addEventListener('change',e=>{
  if(e.target.id==='item-image-file'){
    const file=e.target.files?.[0];
    if(!file)return;
    if(window._rfmPreviewURL)URL.revokeObjectURL(window._rfmPreviewURL);
    window._rfmPreviewURL=URL.createObjectURL(file);
    previewImage(window._rfmPreviewURL);
  }
 });
 document.addEventListener('input',e=>{if(e.target.id==='item-search'){state.search=e.target.value;const list=$('#catalog-items');if(list)list.innerHTML=renderCatalog()}if(e.target.id==='log-search'){const val=e.target.value;state.logSearch=val;const sel=e.target.selectionStart;render();let inp=$('#log-search');if(inp){inp.focus();inp.setSelectionRange(sel,sel)}}});
 document.addEventListener('submit',async e=>{if(!['quantity-form','item-form','entity-form','storage-form','storage-group-form','connect-form','profile-form','join-room-form','invite-form'].includes(e.target.id))return;e.preventDefault();const f=e.target,v=new FormData(f);if(state.busy)return;state.busy=true;f.querySelector('button[type=submit]')?.setAttribute('disabled','');
 try{
 if(f.id==='invite-form'){if(!isAdmin())throw Error('Admin only');const inv=await rpc('create_invite',{p_room:state.roomId,p_role:v.get('role')||'member'});await refreshCloud();showInvite(inv.code,inv.role,inv.expires_at);toast('One-time invitation created');return;}
 if(f.id==='quantity-form'){const m=state.modal,qty=Number(v.get('qty'));if(!Number.isInteger(qty)||qty<1)throw Error('Enter a positive whole quantity');await executeChange(m.action,m.itemId,m.fromId,v.get('to')||m.toId||'',qty);closeModal();toast(m.action==='move'?'Item moved and logged':'Inventory updated and logged');}
 if(f.id==='item-form'){
  if(!isAdmin())throw Error('Only admins can create catalog items');
  const name=v.get('name').trim(),category=v.get('category').trim()||'Other',detail=v.get('detail').trim();
  const photo=v.get('image');let id;
  if(state.mode==='local'){id=uid();state.data.items.push({id,name,category,detail});logEntry('item_created',name,'','',0,detail);localSave();}
  else{id=await rpc('add_item',{p_room:state.roomId,p_name:name,p_category:category,p_detail:detail});await refreshCloud();}
  if(photo instanceof File && photo.size){if(!isAdmin())throw Error('Only admins can add pictures');try{await saveImage(id,photo)}catch(err){toast('Item created, but photo failed: '+err.message,true);closeModal();render();return;}}
  closeModal();render();toast('Item added to master catalog'+(photo?.size?' with picture':'')+'. Nothing was added to storage.');
 }
 if(f.id==='entity-form'){await saveEntity(v);}
 if(f.id==='storage-group-form'){
  const name=v.get('name').trim();if(!name||name.length>80)throw Error('Enter a group name (1-80 characters)');
  if(state.mode==='local'){normalizeLocalStorageGroups();state.data.storage_groups.push({id:uid(),name});logEntry('storage_group_created','','',name);localSave();render()}
  else{await rpc('add_storage_group',{p_room:state.roomId,p_name:name});await refreshCloud()}
  closeModal();toast('Storage group created');
 }
 if(f.id==='storage-form'){
  const name=v.get('name').trim(),groupId=v.get('storage_group_id');
  if(!name||name.length>80)throw Error('Enter a storage name (1-80 characters)');
  if(!state.data.storage_groups?.some(g=>g.id===groupId))throw Error('Storage group not found');
  if(state.mode==='local'){state.data.storages.push({id:uid(),name,storage_group_id:groupId});logEntry('storage_created','','',name);localSave();render()}
  else{await rpc('add_storage',{p_room:state.roomId,p_name:name,p_storage_group:groupId});await refreshCloud()}
  closeModal();toast('Storage created');
 }
 if(f.id==='profile-form'){state.name=v.get('name').trim();localStorage.setItem('rfm_name',state.name);closeModal();render();toast('Name saved');}
 if(f.id==='connect-form'){const url=v.get('url').trim(),key=v.get('key').trim();await connectCloud(url,key);localStorage.setItem('rfm_url',url);localStorage.setItem('rfm_key',key);closeModal();render();toast('Connected! Enter your RFM invitation code to join.');}
 if(f.id==='join-room-form'){state.name=v.get('display_name').trim();localStorage.setItem('rfm_name',state.name);const room=await rpc('join_room',{p_code:v.get('code'),p_display_name:state.name});state.roomId=room.id;localStorage.setItem('rfm_room_id',room.id);await refreshCloud();toast('Welcome to the RFM Panel!');}
 }catch(err){toast(err.message||'Unable to save',true);f.querySelector('button[type=submit]')?.removeAttribute('disabled')}finally{state.busy=false}
 });
 document.addEventListener('dragstart',e=>{if(e.target.closest('button')){e.preventDefault();return}const elem=e.target.closest('[data-drag-item]');if(!elem)return;state.drag={itemId:elem.dataset.dragItem,fromId:elem.dataset.dragFrom||''};e.dataTransfer.effectAllowed=state.drag.fromId?'move':'copy';e.dataTransfer.setData('text/plain',state.drag.itemId)});
 document.addEventListener('dragover',e=>{if(!state.drag)return;const storage=e.target.closest('[data-storage]');if(storage||state.drag.fromId){e.preventDefault();e.dataTransfer.dropEffect=state.drag.fromId?'move':'copy';if(storage)storage.classList.add('dragover')}});
 document.addEventListener('dragleave',e=>{const storage=e.target.closest('[data-storage]');if(storage&&!storage.contains(e.relatedTarget))storage.classList.remove('dragover')});
 document.addEventListener('drop',e=>{const storage=e.target.closest('[data-storage]');document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));if(!state.drag)return;const d=state.drag;state.drag=null;if(!storage){if(d.fromId){e.preventDefault();quantityModal({action:'remove',itemId:d.itemId,fromId:d.fromId})}return}e.preventDefault();if(d.fromId===storage.dataset.storage)return;quantityModal({action:d.fromId?'move':'add',itemId:d.itemId,fromId:d.fromId,toId:storage.dataset.storage})});
 document.addEventListener('dragend',()=>{state.drag=null;document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
}
async function boot(){try{state.data=JSON.parse(localStorage.getItem('rfm_local')||'null')||seedData()}catch{state.data=seedData()}localSave();bind();render();let url=localStorage.getItem('rfm_url')||CONFIG.SUPABASE_URL,key=localStorage.getItem('rfm_key')||CONFIG.SUPABASE_ANON_KEY;if(url&&key){try{await connectCloud(url,key)}catch(err){state.mode='local';state.roomId=null;state.client=null;toast('Shared connection failed: '+err.message,true);render()}}}
boot();
