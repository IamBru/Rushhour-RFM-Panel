    /* Use available content width so browser-local interface scaling also reflows layouts. */
    .shell{container:panel-layout / inline-size}
    .dashboard>*,.panel,.brand>div,.storage-header>.flex>div,.storage-group-head>div,.board-head>div{min-width:0}
    .storages{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
    .brand h1,.subtitle,.title,.help,.item-detail,.act-title,.modal,.pill,.guide{overflow-wrap:anywhere}
    .field,.search{min-width:0;max-width:100%}
    .stock-qty,.stock-buttons{flex-shrink:0}
    .storage-header,.entity-actions{flex-wrap:wrap}
    .price-table{min-width:420px}.price-table-wrap{max-width:100%}
    .member-row{flex-wrap:wrap}.member-row>div{min-width:0}
    .modal{container:dialog-layout / inline-size}

async function compressPhoto(file,maxDimension=540,preserveAlpha=false){
 if(!file || !['image/jpeg','image/png','image/webp'].includes(file.type)) throw Error('Choose a JPG, PNG or WebP image');
 if(file.size>12*1024*1024)throw Error('Image is too large (12 MB maximum before compression)');
 const temp=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=temp;await img.decode();
  const scale=Math.min(1,maxDimension/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image processing unavailable');
  if(!preserveAlpha){ctx.fillStyle='#21182f';ctx.fillRect(0,0,canvas.width,canvas.height);}ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.77));
  if(!blob || blob.type!=='image/webp'){
   const jpg=await new Promise(resolve=>canvas.toBlob(resolve,preserveAlpha?'image/png':'image/jpeg',.75));
   if(!jpg)throw Error('Unable to compress image');
   if(jpg.size>950000)throw Error('Compressed picture is still too large; use a smaller image');
   return {blob:jpg,extension:preserveAlpha?'png':'jpg'};
  }
  if(blob.size>950000)throw Error('Compressed picture is still too large; use a smaller image');

}

 await refreshCloud();
}

function captureScroll(){

  return {key:el.dataset.scrollKey,left:el.scrollLeft,top:el.scrollTop,anchor:anchor?.dataset.scrollAnchor,offset:anchor?anchor.getBoundingClientRect().top-top:0};
 });
 return {positions,x:window.scrollX||0,y:window.scrollY||0};
}
function restoreScroll(saved){
 for(const el of document.querySelectorAll('[data-scroll-key]')){
  const pos=saved.positions.find(p=>p.key===el.dataset.scrollKey);if(!pos)continue;
  el.scrollLeft=pos.left;el.scrollTop=pos.top;
  const anchor=pos.anchor&&Array.from(el.querySelectorAll('[data-scroll-anchor]')).find(row=>row.dataset.scrollAnchor===pos.anchor);
  if(anchor)el.scrollTop+=anchor.getBoundingClientRect().top-el.getBoundingClientRect().top-pos.offset;

 window.scrollTo?.({left:saved.x,top:saved.y,behavior:'instant'});
}

 setModal(`<h2>Settings</h2>${displaySettings()}${catalogSettings()}<h3>Members & invitations</h3><p>Only admins can invite, remove or promote members. Each invitation is usable once and expires after 14 days.</p><form id="invite-form"><label class="field-label">Invite as</label><select class="field" name="role"><option value="member">Member</option><option value="admin">Admin</option></select>${modalActions('Create one-time invite')}</form><div style="margin-top:18px"><b style="font-size:13px">Members</b>${rows||'<div class="help">No members yet</div>'}</div>${invites?`<div style="margin-top:20px"><b style="font-size:13px">Unused invitations</b>${invites}</div>`:''}${state.mode==='cloud'?`<div class="setup-card" style="margin-top:20px"><b>Activity history</b><p>Permanently delete all activity logs for this RFM group. Inventory, catalog items and memberships stay unchanged. Export the activity log first if you want to keep a copy.</p><button class="btn danger full" data-action="clear-logs" type="button">Clear database logs</button></div>`:''}<div class="modal-actions"><button class="btn primary" data-action="close-modal">Done</button></div>`);
}
function showInvite(code,role,expiry){setModal(`<h2>One-time invitation ready</h2><p>Send this private code to your ${esc(role)}. It can be redeemed once before ${esc(dateText(expiry))}.</p><label class="field-label">Invitation code</label><input class="field" id="invite-code" readonly value="${esc(code)}"><div class="modal-actions"><button class="btn" data-action="copy-code">Copy code</button><button class="btn primary" data-action="share">Back to members</button></div><div class="tip">The code will not be displayed again after closing. Copy it now. Don't post it publicly.</div>`)}
// The RPC rechecks active-admin authorization before clearing database history.
async function clearLogs(){
 if(state.mode!=='cloud'||!state.roomId||!isAdmin())throw Error('Only active admins can clear database logs');
 if(state.busy)return;
 if(!await confirmAction('Permanently delete ALL activity logs for this RFM group? This cannot be undone. Export the activity log first if you need a copy.'))return;
 state.busy=true;
 const button=document.querySelector('[data-action="clear-logs"]');
 if(button)button.disabled=true;
 try{
  await rpc('clear_logs',{p_room:state.roomId});
  state.data.logs=[];state.logSearch='';
  closeModal();render();toast('Activity logs cleared');
  try{await refreshCloud()}catch{toast('Logs cleared, but the panel could not refresh. Refresh the page.',true)}
 }finally{state.busy=false;if(button)button.disabled=false;}
}
async function rpc(name, args){const {data,error}=await state.client.rpc('rfm_'+name,args);if(error)throw new Error(error.message||'Request failed');return data}
async function connectCloud(url,key){if(!window.supabase)throw Error('Cloud library unavailable. Check internet access.');if(!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(url.trim()))throw Error('Enter a valid Supabase project URL');if(key.includes('service_role')||key.startsWith('sb_secret_'))throw Error('Do not use a secret key. Use the publishable / anon key.');
 const client=window.supabase.createClient(url.trim().replace(/\/$/,''),key.trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 let {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){const res=await client.auth.signInAnonymously();if(res.error)throw new Error(res.error.message+' — enable Anonymous Sign-ins in Supabase Authentication.');}
 state.client=client;state.mode='cloud';state.roomId=localStorage.getItem('rfm_room_id')||null;
 // A cached room ID is only a hint. The server always checks current membership.
 if(state.roomId){
  try{await refreshCloud();}
  catch(e){
   // On a temporary network/API error, keep the cached room ID for a later retry.
   throw new Error('Could not verify your RFM membership right now: '+e.message);
  }
 }
 // Fresh browser or an old "leave view" action: recover the active membership
 // associated with the existing anonymous Supabase sign-in, without an invite.
 if(!state.roomId){
  const recovered=await rpc('restore_membership',{});
  if(recovered){
   state.roomId=recovered;
   localStorage.setItem('rfm_room_id',recovered);
   await refreshCloud();
  }
 }
 if(!state.roomId)render();
 window.clearInterval(window._syncInterval);
 window._syncInterval=setInterval(()=>{if(state.mode==='cloud'&&state.roomId&&!state.busy)refreshCloud(true).catch(()=>{})},5000);
}
async function refreshCloud(silent=false){if(!state.roomId)return;try{let data=await rpc('get_snapshot',{p_room:state.roomId});
 const previous=state.data?.logs||[];
 if(data.viewer?.role==='admin'&&previous.length>150&&data.logs.length>=150){
  const newCount=data.logs.filter(x=>Number(x.id)>Number(previous[0]?.id||0)).length;
  const target=previous.length+newCount,logs=[];
  while(logs.length<target){const limit=Math.min(1000,target-logs.length);const batch=await rpc('get_activity',{p_room:state.roomId,p_limit:limit,p_offset:logs.length});logs.push(...batch);if(batch.length<limit)break;}
  data.logs=logs;
 }
 state.data=data;if(state.section==='ranks'){try{await loadRanks()}catch{}}if(state.section==='prices'){try{await loadPrices()}catch{}}state.name=data.viewer?.name||state.name;if(!isAdmin()&&state.section==='activity')state.section='storage';state.lastSync=Date.now();if(!silent||!document.activeElement||(!['item-search','log-search'].includes(document.activeElement.id)&&!document.activeElement.dataset?.priceSearch)){render()}}catch(e){if(/membership is inactive|do not have access/i.test(e.message)){state.roomId=null;localStorage.removeItem('rfm_room_id');state.section='storage';closeModal();render();toast('Your RFM access has been revoked.',true);return;}throw e;}}
async function executeChange(action,item,from,to,qty,description=''){if(state.mode==='local')demoChange(action,item,from,to,qty,description);else await rpc('change_stock',{p_room:state.roomId,p_action:action,p_item:item,p_from:from||null,p_to:to||null,p_quantity:qty,...(description?{p_blueprint_description:description}:{})});if(state.mode==='cloud')await refreshCloud();else render()}
async function getExport(){
 if(!isAdmin())throw Error('Only admins can download backups');
 // Refresh the snapshot so a revoked or demoted admin cannot export cached data.
 const d=state.mode==='cloud'?await rpc('get_snapshot',{p_room:state.roomId}):state.data;
 if(state.mode==='cloud'&&d?.viewer?.role!=='admin')throw Error('Only active admins can download backups');
 return JSON.stringify({...d,exported_at:new Date().toISOString()},null,2);
}
function download(content,name,mime){const b=new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const csv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
async function exportLog(){if(!isAdmin())throw Error('Admin permission required');let logs=state.data.logs;
 if(state.mode==='cloud'){logs=[];let page=0;while(true){let batch=await rpc('get_activity',{p_room:state.roomId,p_limit:1000,p_offset:page*1000});logs.push(...batch);page++;if(batch.length<1000)break;if(page>50)throw Error('Too many history rows; ask to export an archive')} }
 const cols=['created_at','actor_name','action','item_name','quantity','from_name','to_name','detail'];download([cols.map(csv).join(','),...logs.map(x=>cols.map(k=>csv(x[k])).join(','))].join('\r\n'),'RFM-activity-'+new Date().toISOString().slice(0,10)+'.csv','text/csv');toast('Activity CSV downloaded')}
function bind(){
 let backdropPress=null;
 document.addEventListener('pointerdown',e=>{backdropPress=e.button===0&&e.target.dataset?.action==='close-modal-overlay'?e.target:null});
 document.addEventListener('pointercancel',()=>{backdropPress=null});
 document.addEventListener('click',async e=>{
 const pressedBackdrop=backdropPress;backdropPress=null;
 const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 try{
 if(a==='section'){if(!['storage','prices','ranks','activity'].includes(el.dataset.section))return;if(el.dataset.section==='activity'&&!isAdmin())throw Error('Admin only');state.section=el.dataset.section;if(state.section==='ranks'){try{await loadRanks()}catch{}}if(state.section==='prices'){try{await loadPrices()}catch{}}render();return}
 if(a==='reload-ranks'){try{await loadRanks()}catch{}render();return}
 if(a==='rank-edit'){editRankModal(el.dataset.key);return}
 if(a==='rank-assign'){assignRankModal(el.dataset.user);return}
 if(a==='price-sort'){if(!['name','quality','rolls'].includes(el.dataset.key))return;const v=priceView(el.dataset.vendor);v.direction=v.sort===el.dataset.key?-v.direction:1;v.sort=el.dataset.key;render();return}
 if(a==='price-filter-reset'){delete state.priceViews[el.dataset.vendor];render();return}
 if(a==='reload-prices'){try{await loadPrices()}catch{}render();return}
 if(a==='price-edit'){priceEditModal(el.dataset.kind,el.dataset.id,el.dataset.vendor);return}
 if(a==='price-delete'){await deletePrice(el.dataset.kind,el.dataset.id);return}
 if(a==='confirm-action'){const resolve=confirmationResolve;confirmationResolve=null;closeModal();if(resolve)resolve(true);return}
 if(a==='remove-all'){await removeAll();return}
 if(a==='close-modal'){closeModal();return}
 if(a==='close-modal-overlay'){if(e.target===el&&pressedBackdrop===el)closeModal();return}
 if(a==='reset-scale'){applyDisplayScale(100);const select=$('#display-scale');if(select)select.value='100';return}
 if(a==='configure'){setupModal();return}
 if(a==='profile'){profileModal();return}
 if(a==='edit-entity'){editEntityModal(el.dataset.kind,el.dataset.id);return}
 if(a==='delete-entity'){await deleteEntity(el.dataset.kind,el.dataset.id);return}
 if(a==='create-option'){await createConfiguredOption(el);return}
 if(a==='create-inline-category'){await createInlineCategory();return}
 if(a==='new-item'){if(!isAdmin())throw Error('Only admins can create catalog items');newItemModal();return}
 if(a==='new-storage'){newStorageModal(el.dataset.storageGroup);return}
 if(a==='new-storage-group'){newStorageGroupModal();return}
 if(a==='share'){shareModal();return}
 if(a==='clear-logs'){await clearLogs();return}
 if(a==='revoke-member'){if(!isAdmin())throw Error('Admin only');const m=state.data.members.find(x=>x.user_id===el.dataset.user);if(!m)return;if(!await confirmAction('Revoke '+m.name+' access? This immediately prevents future inventory changes.'))return;await rpc('revoke_member',{p_room:state.roomId,p_user:m.user_id});await refreshCloud();shareModal();toast('Member access revoked');return}
 if(a==='change-role'){if(!isAdmin())throw Error('Admin only');const m=state.data.members.find(x=>x.user_id===el.dataset.user);if(!m)return;if(!await confirmAction('Change '+m.name+' to '+el.dataset.role+'?'))return;await rpc('set_member_role',{p_room:state.roomId,p_user:m.user_id,p_role:el.dataset.role});await refreshCloud();shareModal();toast('Role updated');return}
 if(a==='cancel-invite'){if(!isAdmin())throw Error('Admin only');if(!await confirmAction('Cancel this unused invitation?'))return;await rpc('cancel_invite',{p_room:state.roomId,p_invite:el.dataset.invite});await refreshCloud();shareModal();toast('Invitation canceled');return}
 if(a==='copy-code'){const input=$('#invite-code');if(!input)throw Error('No invitation code shown');await navigator.clipboard.writeText(input.value);toast('Personal invitation code copied');return}
 if(a==='filter'){state.filter=el.dataset.filter;render();return}

 if(a==='add-one'){quantityModal({action:'add',itemId:el.dataset.item,toId:el.dataset.storageId,blueprintDescription:el.dataset.blueprintDescription});return}
 if(a==='remove-one'){quantityModal({action:'remove',itemId:el.dataset.item,fromId:el.dataset.storageId,blueprintDescription:el.dataset.blueprintDescription});return}
 if(a==='move-one'){quantityModal({action:'move',itemId:el.dataset.item,fromId:el.dataset.storageId,blueprintDescription:el.dataset.blueprintDescription});return}
 if(a==='export'){download(await getExport(),'RFM-inventory-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Backup downloaded');return}
 if(a==='export-log'){if(!isAdmin())throw Error('Admin only');await exportLog();return}
 if(a==='load-older'){if(!isAdmin())throw Error('Admin only');const batch=await rpc('get_activity',{p_room:state.roomId,p_limit:150,p_offset:state.data.logs.length});if(batch.length===0)toast('No older changes');else {state.data.logs.push(...batch);render()}return}
 if(a==='use-demo'){state.mode='local';state.roomId=null;state.data=JSON.parse(localStorage.getItem('rfm_local')||'null')||seedData();render();return}
 }catch(err){toast(err.message||'Something went wrong',true)}
 });
 document.addEventListener('change',e=>{
 if(e.target.dataset?.priceQuality){priceView(e.target.dataset.priceQuality).quality=e.target.value;render();return}
 if(e.target.id==='family-rank-select'){$('#family-promotion-select').innerHTML=rankPromotionOptions(e.target.value);return}
  if(e.target.dataset.configuredOption){const fields=e.target.closest('[data-option-kind]').querySelector('[data-option-fields]');if(fields){fields.hidden=!(isAdmin()&&e.target.selectedOptions[0]?.dataset.createOption);if(!fields.hidden)fields.querySelector('input').focus();}return;}
  if(e.target.name==='category'&&e.target.closest('#item-form')){const fields=$('#new-category-fields');if(fields){fields.hidden=!(isAdmin()&&e.target.selectedOptions[0]?.dataset.createCategory);if(!fields.hidden)$('#new-category-name').focus();}return;}
  if(e.target.id==='display-scale'){try{applyDisplayScale(e.target.value)}catch(err){toast(err.message,true)}return;}
  if(e.target.id==='item-image-file'){
    const file=e.target.files?.[0];
    if(!file)return;
    if(window._rfmPreviewURL)URL.revokeObjectURL(window._rfmPreviewURL);
    window._rfmPreviewURL=URL.createObjectURL(file);
    previewImage(window._rfmPreviewURL);
  }
 });
 document.addEventListener('input',e=>{if(e.target.dataset?.priceSearch){updatePriceSearch(e.target);return}if(e.target.id==='item-search'){state.search=e.target.value;const list=$('#catalog-items');if(list)list.innerHTML=renderCatalog()}if(e.target.id==='log-search'){const val=e.target.value;state.logSearch=val;const sel=e.target.selectionStart;render();let inp=$('#log-search');if(inp){inp.focus();inp.setSelectionRange(sel,sel)}}});
 document.addEventListener('submit',async e=>{if(!['rank-form','rank-assignment-form','price-form','logo-form','quantity-form','item-form','entity-form','storage-form','storage-group-form','connect-form','profile-form','join-room-form','invite-form'].includes(e.target.dataset.form||e.target.id))return;e.preventDefault();const f=e.target,v=new FormData(f);if(state.busy)return;state.busy=true;f.querySelector('button[type=submit]')?.setAttribute('disabled','');
 try{

 if(f.id==='rank-form'){await saveRank(v);return;}
 if(f.id==='rank-assignment-form'){await saveRankAssignment(v);return;}
 if(f.id==='price-form'){await savePrice(v);return;}
 if(f.id==='logo-form'){await saveLogo(v);shareModal();toast('Logo updated');return;}
 if(f.id==='invite-form'){if(!isAdmin())throw Error('Admin only');const inv=await rpc('create_invite',{p_room:state.roomId,p_role:v.get('role')||'member'});await refreshCloud();showInvite(inv.code,inv.role,inv.expires_at);toast('One-time invitation created');return;}
 if(f.id==='quantity-form'){const m=state.modal,qty=Number(v.get('qty'));if(!Number.isInteger(qty)||qty<1)throw Error('Enter a positive whole quantity');const description=m.chooseBlueprint?(v.get('blueprint_description')||''):m.blueprintDescription;if(m.chooseBlueprint&&!configuredOptions('blueprint').includes(description))throw Error('Choose a Blueprint description');await executeChange(m.action,m.itemId,m.fromId,v.get('to')||m.toId||'',qty,description);closeModal();toast(m.action==='move'?'Item moved and logged':'Inventory updated and logged');}
 if(f.id==='item-form'){
  if(!isAdmin())throw Error('Only admins can create catalog items');
  const name=v.get('name').trim(),category=(v.get('category')||'').trim(),detail=v.get('detail').trim();
  if(!categoryNames().includes(category))throw Error('Choose a configured category');
  const photo=v.get('image');let id;
  if(state.mode==='local'){id=uid();state.data.items.push({id,name,category,detail});logEntry('item_created',name,'','',0,detail);localSave();}
  else{id=await rpc('add_item',{p_room:state.roomId,p_name:name,p_category:category,p_detail:detail});await refreshCloud();}
  if(photo instanceof File && photo.size){if(!isAdmin())throw Error('Only admins can add pictures');try{await saveImage(id,photo)}catch(err){toast('Item created, but photo failed: '+err.message,true);closeModal();render();return;}}
  closeModal();render();toast('Item added to master catalog'+(photo?.size?' with picture':'')+'. Nothing was added to storage.');
 }
 if(f.id==='entity-form'){await saveEntity(v);}
 if(f.id==='storage-group-form'){
 if(!isAdmin())throw Error('Only admins can create storage groups');
  const name=v.get('name').trim();if(!name||name.length>80)throw Error('Enter a group name (1-80 characters)');
  if(state.mode==='local'){normalizeLocalStorageGroups();state.data.storage_groups.push({id:uid(),name});logEntry('storage_group_created','','',name);localSave();render()}
  else{await rpc('add_storage_group',{p_room:state.roomId,p_name:name});await refreshCloud()}
  closeModal();toast('Storage group created');
 }
 if(f.id==='storage-form'){
 if(!isAdmin())throw Error('Only admins can create storages');
  const name=v.get('name').trim(),groupId=v.get('storage_group_id');
  if(!name||name.length>80)throw Error('Enter a storage name (1-80 characters)');
  if(!state.data.storage_groups?.some(g=>g.id===groupId))throw Error('Storage group not found');
  if(state.mode==='local'){state.data.storages.push({id:uid(),name,storage_group_id:groupId});logEntry('storage_created','','',name);localSave();render()}
  else{await rpc('add_storage',{p_room:state.roomId,p_name:name,p_storage_group:groupId});await refreshCloud()}
  closeModal();toast('Storage created');
 }
 if(f.id==='profile-form'){await saveProfileName(v.get('name'));}
 if(f.id==='connect-form'){const url=v.get('url').trim(),key=v.get('key').trim();await connectCloud(url,key);localStorage.setItem('rfm_url',url);localStorage.setItem('rfm_key',key);closeModal();render();toast('Connected! Enter your RFM invitation code to join.');}
 if(f.id==='join-room-form'){state.name=v.get('display_name').trim();localStorage.setItem('rfm_name',state.name);const room=await rpc('join_room',{p_code:v.get('code'),p_display_name:state.name});state.roomId=room.id;localStorage.setItem('rfm_room_id',room.id);await refreshCloud();toast('Welcome to the RFM Panel!');}
 }catch(err){toast(err.message||'Unable to save',true);f.querySelector('button[type=submit]')?.removeAttribute('disabled')}finally{state.busy=false}
 });
 document.addEventListener('dragstart',e=>{if(e.target.closest('button')){e.preventDefault();return}const header=e.target.closest('[data-drag-storage]');if(header){if(!isAdmin()||state.busy){e.preventDefault();return}state.drag={storageId:header.dataset.dragStorage};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',state.drag.storageId);return}const elem=e.target.closest('[data-drag-item]');if(!elem)return;state.drag={itemId:elem.dataset.dragItem,fromId:elem.dataset.dragFrom||'',blueprintDescription:elem.dataset.dragFrom?elem.dataset.blueprintDescription:undefined};e.dataTransfer.effectAllowed=state.drag.fromId?'move':'copy';e.dataTransfer.setData('text/plain',state.drag.itemId)});
 document.addEventListener('dragover',e=>{if(!state.drag)return;if(state.drag.storageId){const group=e.target.closest('[data-drop-group]');if(isAdmin()&&group?.dataset.dropGroup){e.preventDefault();e.dataTransfer.dropEffect='move';group.classList.add('dragover')}return}const storage=e.target.closest('[data-storage]');if(storage||state.drag.fromId){e.preventDefault();e.dataTransfer.dropEffect=state.drag.fromId?'move':'copy';if(storage)storage.classList.add('dragover')}});
 document.addEventListener('dragleave',e=>{const group=e.target.closest('[data-drop-group]');if(group&&!group.contains(e.relatedTarget))group.classList.remove('dragover');const storage=e.target.closest('[data-storage]');if(storage&&!storage.contains(e.relatedTarget))storage.classList.remove('dragover')});
 document.addEventListener('drop',async e=>{const storage=e.target.closest('[data-storage]');document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));if(!state.drag)return;const d=state.drag;state.drag=null;if(d.storageId){e.preventDefault();const group=e.target.closest('[data-drop-group]');if(group?.dataset.dropGroup){try{await moveStorageToGroup(d.storageId,group.dataset.dropGroup)}catch(err){toast(err.message,true)}}return}if(!storage){if(d.fromId){e.preventDefault();quantityModal({action:'remove',itemId:d.itemId,fromId:d.fromId,blueprintDescription:d.blueprintDescription})}return}e.preventDefault();if(d.fromId===storage.dataset.storage)return;quantityModal({action:d.fromId?'move':'add',itemId:d.itemId,fromId:d.fromId,toId:storage.dataset.storage,blueprintDescription:d.blueprintDescription})});
 document.addEventListener('dragend',()=>{state.drag=null;document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
}
async function boot(){document.documentElement.style.zoom=String(displayScale()/100);try{state.data=JSON.parse(localStorage.getItem('rfm_local')||'null')||seedData()}catch{state.data=seedData()}localSave();bind();render();let url=localStorage.getItem('rfm_url')||CONFIG.SUPABASE_URL,key=localStorage.getItem('rfm_key')||CONFIG.SUPABASE_ANON_KEY;if(url&&key){try{await connectCloud(url,key)}catch(err){state.mode='local';state.roomId=null;state.client=null;toast('Shared connection failed: '+err.message,true);render()}}}
boot();
</script></body></html>
